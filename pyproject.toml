[project]
name = "vgrab-web"
version = "1.1.0"
description = "智能视频抓取 Web 版 — 下载/转录/分析/录制"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "yt-dlp>=2025.0",
    "waitress>=2.0",
]

[project.optional-dependencies]
native = ["pywebview>=4.0"]
dev = ["pytest>=7.0", "pytest-cov", "mypy", "ruff"]

[project.scripts]
vgrab = "cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = false  # 逐步启用

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=features --cov-report=term-missing"
